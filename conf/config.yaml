defaults:
  - search_space: llama_mixed_precision
  - algorithm: nsga2
  - tracking: wandb
  - _self_

project_name: "EMPAS"
seed: 42
deterministic: false

model_name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
model_revision: null

quantization:
  backend: "bitsandbytes"
  group_size: 64
  compute_dtype: "float16"

# Global Settings
model_type: "llama"
target_device: "cuda"

evaluator:
  type: "proxy"
  profile_path: "./data/profiles/tinyllama_sensitivity.json"

data:
  dataset: "wikitext"
  allow_synthetic_data: false
  protocol:
    calibration:
      split: "train"
      seq_len: 128
      nsamples: 4
      seed: 42
    validation:
      split: "validation"
      seq_len: 128
      nsamples: 4
      seed: 43
    test:
      split: "test"
      seq_len: 128
      nsamples: 4
      seed: 44

paths:
  search_output_dir: "./data/logs/search_tinyllama_wandb"
  manifest_path: "./data/manifests/search_manifest.json"
  profile_path: "./data/profiles/tinyllama_sensitivity.json"
  resume_from: null

validation:
  genome: [4, 16, 8, 8, 4, 4, 4, 8, 8, 8, 8, 4, 4, 8, 8, 8, 16, 16, 4, 8, 16, 16]

